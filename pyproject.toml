[project]
name = "plant-debate"
version = "0.1.0"
description = "AI safety via debate (Irving et al., 2018) applied to an industrial alarm: two agents argue, a weaker judge decides from verified evidence."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
